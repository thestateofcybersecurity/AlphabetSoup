name: Test, build, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Healthy runs finish in about two minutes. A hung Playwright step once sat
    # here for fifteen and had to be cancelled by hand; without a cap it would
    # have run to GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on known dependency vulnerabilities (moderate and up).
      - run: npm audit --audit-level=moderate
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Publishing the artifact takes seconds; this only guards a stuck upload.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow-family search engines (Bing, and through it the indexes
  # behind ChatGPT search and Copilot) what just changed, instead of waiting
  # for the next crawl. Submits the pages most likely to be fresh: the
  # homepage, the blog index, and the newest posts. The key is public by
  # design; the generator publishes the matching key file at the site root.
  # Non-fatal on failure: indexing hints should never block or fail a deploy.
  indexnow:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping IndexNow with fresh URLs
        run: |
          KEY="cas2026indexnow8f41b2c7d5e9a638"
          HOST="www.cybersecurityalphabetsoup.com"
          posts=$(jq -r 'sort_by(.date) | reverse | .[0:5][] | "https://www.cybersecurityalphabetsoup.com/blog/\(.slug).html"' src/data/blog-posts.json)
          list=$(printf '%s\n' "https://$HOST/" "https://$HOST/blog/" "https://$HOST/llms.txt" $posts | jq -R . | jq -s -c .)
          curl -sS --max-time 30 -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$list}" \
            && echo "IndexNow pinged" || echo "IndexNow ping failed (non-fatal)"
