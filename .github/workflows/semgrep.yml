name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 3 * * 1' # Mondays 03:31 UTC

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    # Consistently around 45 seconds.
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned: an unpinned install runs whatever wheel PyPI serves that day
      # with security-events: write. Dependabot does not track pip here, so
      # bump this by hand (pip index versions semgrep).
      - name: Install Semgrep
        run: pip install semgrep==1.180.0

      # Public OSS rulesets; no Semgrep Cloud account or token required.
      - name: Scan
        continue-on-error: true
        run: >
          semgrep scan
          --config=p/security-audit
          --config=p/secrets
          --config=p/javascript
          --config=p/typescript
          --sarif --output=semgrep.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
