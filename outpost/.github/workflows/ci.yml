name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTPOST_TEST_ADMIN_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: psql client
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests && ruff format --check src tests
      - name: two-tenant suite and SQL lints
        run: pytest -q
